# Single Worker: serves the built SPA from ./dist and the /api routes backed by D1
name = "pantagon-items"
main = "worker/index.ts"
compatibility_date = "2025-12-01"
account_id = "b76e4b50bfd52760bbbfec7ff7fc89c0"

# Production hostname (previously on the old Pages project)
routes = [{ pattern = "items.pantagon.org", custom_domain = true }]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Shared personal database; this app owns the `items` table
[[d1_databases]]
binding = "DB"
database_name = "PANTAGON_PERSONAL"
database_id = "63c3fba9-ac1d-4260-b1ce-79470b3519af"
migrations_dir = "migrations"

[observability]
enabled = true
